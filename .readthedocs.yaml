# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

# The shared content — the "install Raspberry Pi OS" and "set up your Pi" pages,
# plus the common appendix — lives in a separate repository and is mounted at
# docs/source/_shared, so Sphinx resolves it as ``/_shared/...``.
# Read the Docs does not initialise submodules unless this block is present.
submodules:
  include: all
  recursive: true

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

sphinx:
  # Paths below are relative to the repository root (this file's directory).
  # The Sphinx project itself lives in docs/.
  configuration: docs/source/conf.py
  # English is the master copy and the only language on this branch. Once the
  # first build is clean, set this to true so a broken reference fails the build.
  fail_on_warning: false

# HTML only for now. Add pdf/epub once a real build has been verified.
formats: []

python:
  install:
    - requirements: docs/requirements.txt
